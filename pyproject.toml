[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmes"
version = "0.1.0.dev0"
description = "Standalone G-MES automation CLI (Chrome DevTools Protocol driver for Samsung G-MES)."
requires-python = ">=3.12"
dependencies = [
    "websocket-client>=1.6",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
gmes = "gmes.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]
