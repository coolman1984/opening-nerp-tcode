rules:
  - id: gmes-entrances-are-legacy-only
    rule: both GMES_Workflow.bat branches (no-argument and argument-bearing) load flat legacy modules from the repository root and zero gmes.* package modules
    enforcement: tests/test_legacy_entrance.py
  - id: launcher-cannot-repoint-to-a-package
    rule: GMES_Workflow.bat text (matched case-insensitively) never contains PYTHONPATH, "python -m gmes", or "gmes.bat" - the three ways the entrance drifted to a package engine before
    enforcement: tests/test_legacy_entrance.py
  - id: no-standalone-package-in-tree
    rule: no src/gmes directory is tracked in the repository; the former package is recoverable from git history only (commit 59eb838, branch archive/standalone-gmes-before-removal), never present as a directory that could be run by accident
    enforcement: tests/test_legacy_entrance.py
  - id: cdp-common-is-the-transport-every-run-uses
    rule: cdp_common.py is the CDP transport every G-MES entrance passes through; a change to it must keep tests/test_cdp_common.py and the G-MES suites green in the same commit. It carried N-ERP too until HISTORY.md Phase 72; the guards that protect the shared half now live in a file named after the module, not after a system.
    enforcement: "tests/test_cdp_common.py + tests/test_gmes_core.py + tests/test_legacy_hardening.py"
  - id: shared-cdp-guards-must-not-be-deleted-with-a-system
    rule: tests/test_cdp_common.py must exist. It holds the only automated proof of --disable-popup-blocking (AD SSO, Phase 56.1/57.7) and capture_screenshot(tab=) (Phase 56.4/57.8); both were nearly lost in Phase 72 because they lived in a file named for the system being removed.
    enforcement: tests/test_project_eye.py
  - id: credentials-dpapi-only
    rule: "no password is written anywhere but the DPAPI store (gmes_credentials.py for G-MES); never printed, logged, or passed as an argument. The active %LOCALAPPDATA%/GMES_Automation/credentials.dat and historical %LOCALAPPDATA%/GMES/credentials.dat stores are both protected: neither may be inspected, migrated, overwritten, normalized, or deleted."
    enforcement: "CLAUDE.md rules 2.1a/2.2 + tests/test_project_eye.py"
  - id: gmes-screenshots-use-explicit-targets
    rule: G-MES diagnostics use gmes_common's strict resolver unless they are gmes_inspect.py iterating an explicit tab; that sole direct CDP capture must pass tab=tab. Generic G-MES screenshot calls without an explicit target are forbidden.
    enforcement: tests/test_legacy_hardening.py
  - id: the-users-real-browser-profile-is-read-only
    rule: "the user's real Chrome/Edge profile is read during the first-run copy and never otherwise touched: never launched, never debugged, never written to, never deleted. cdp_common.launch_automation_chrome refuses any --user-data-dir that is, or is inside, a real profile of either supported browser."
    enforcement: "tests/test_browser_bootstrap.py + CLAUDE.md rules 2.1/2.1a"
  - id: the-first-run-copy-happens-once
    rule: "a profile is copied only when the automation has none. Once %LOCALAPPDATA%/GMES_Automation/browser.json records a completed run - or a profile directory simply exists - nothing is copied again, because a second copy would overwrite the G-MES session the automation has since earned. A copy is promoted into place by one rename after verification, so an interrupted first run never leaves a partial profile that a later run would drive."
    enforcement: tests/test_browser_bootstrap.py
  - id: a-profile-copy-never-crosses-machines
    rule: "browser.json records the machine its profile was built on. A record from another PC is never reused - Chrome 140+ binds cookie encryption to the machine, so the copy would decrypt nothing silently - and is never deleted either; this machine is set up in a directory of its own beside it."
    enforcement: tests/test_browser_bootstrap.py
  - id: never-sleep-a-fixed-duration
    rule: automation waits poll until the observed condition is true, with a generous cap - never a bare time.sleep(N) standing in for a wait
    enforcement: manual review per CLAUDE.md rule 3.1 (no automated static check in this repository)
  - id: history-entry-per-behavior-change
    rule: any change to automation behavior carries a HISTORY.md entry in the same commit, in Symptom/Cause/Fix/Lesson shape
    enforcement: manual review per CLAUDE.md rule 1
