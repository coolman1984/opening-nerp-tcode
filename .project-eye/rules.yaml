rules:
  - id: cli-application-only
    rule: every cli file imports project behavior only through application facade and never operates CDP/WebSocket sessions
    enforcement: tests/unit/test_architecture_rules.py
  - id: application-orchestrates
    rule: application may orchestrate domain capabilities; domains do not import legacy flat G-MES modules
    enforcement: tests/unit/test_architecture_rules.py
  - id: no-nerp-in-gmes
    rule: src/gmes never imports N-ERP modules
    enforcement: tests/unit/test_architecture_rules.py
  - id: no-business-recipe-in-core
    rule: report-specific recipes stay outside src/gmes/application
    enforcement: tests/unit/test_architecture_rules.py
  - id: runtime-session-owner
    rule: application operations own sign-in, browser/CDP acquire-use-release; public facade returns typed results, never infrastructure handles
    enforcement: tests/unit/test_architecture_rules.py
  - id: specialized-public-interface-only
    rule: examples and specialized consumers use only public G-MES capabilities, never browser/query/screen internals or raw sessions
    enforcement: tests/unit/test_architecture_rules.py
  - id: localappdata-runtime-only
    rule: standalone runtime state resolves under %LOCALAPPDATA%/GMES, except the established Chrome-owned copy of the Default profile at %LOCALAPPDATA%/Google/Chrome/CDP Profile
    enforcement: tests/unit/test_architecture_rules.py
  - id: doctor-read-only
    rule: doctor never migrates credentials or writes runtime state; only explicit gmes credentials set may replace a DPAPI credential
    enforcement: tests/unit/test_architecture_rules.py
  - id: no-god-or-catchall-modules
    rule: no modules named utils/common/helpers and standalone modules remain bounded
    enforcement: tests/unit/test_architecture_rules.py
